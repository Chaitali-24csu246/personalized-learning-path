name: Test and deploy Learning Path
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-path-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: learning_path_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline training dependencies
        run: python -m pip install -r training/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real PostgreSQL row-level access policies
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h localhost -U postgres -d learning_path_test -v ON_ERROR_STOP=1 -f backend/ci-auth-stub.sql
          psql -h localhost -U postgres -d learning_path_test -v ON_ERROR_STOP=1 -f backend/schema.sql
          psql -h localhost -U postgres -d learning_path_test -v ON_ERROR_STOP=1 -f backend/test_rls.sql
      - name: Validate content, reference answers, learner model and policy
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript and recommendation integration
        run: |
          npm run check
          npm test
      - name: Check content is reproducible
        run: |
          python scripts/build_content.py
          git diff --exit-code -- web/content.json
      - name: Evaluate saved policy on held-out simulated learners
        run: python training/evaluate.py --learners 30
      - name: Package downloadable source
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: learning-path-source
          path: release/personalized-learning-path.zip
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-evaluation
          path: training/evaluation.json
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require public backend configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY"
          python scripts/configure.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy tested website
        id: deployment
        uses: actions/deploy-pages@v4
