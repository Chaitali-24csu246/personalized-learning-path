name: Test and deploy Learning Path
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-path-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate content, reference answers, learner model and policy
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript and recommendation integration
        run: |
          npm run check
          npm test
      - name: Check content is reproducible
        run: |
          python scripts/build_content.py
          git diff --exit-code -- web/content.json
      - name: Evaluate saved policy on held-out simulated learners
        run: python training/evaluate.py --learners 30
      - name: Package downloadable source
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: learning-path-source
          path: release/personalized-learning-path.zip
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-evaluation
          path: training/evaluation.json
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy tested website
        id: deployment
        uses: actions/deploy-pages@v4
